name: Automated Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.1.5)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Validate release request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $VERSION (expected x.y.z)"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Use a new patch version."
            exit 1
          fi

          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Use a new patch version."
            exit 1
          fi

      - name: Set release version metadata
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Verify release metadata (pre-build)
        run: npm run verify-release -- --expected-version="${{ inputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Verify release metadata (post-build)
        run: npm run verify-release -- --expected-version="${{ inputs.version }}"

      - name: Verify release artifacts
        run: |
          for file in main.js manifest.json styles.css "release-notes-${{ inputs.version }}.md"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const expected = process.argv[1];
            if (manifest.id !== "make-it-rain") {
              throw new Error(`manifest id mismatch: ${manifest.id}`);
            }
            if (manifest.version !== expected) {
              throw new Error(`manifest version mismatch: ${manifest.version} !== ${expected}`);
            }
          ' "${{ inputs.version }}"

      - name: Commit release metadata
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add package.json package-lock.json manifest.json versions.json
          if git diff --staged --quiet; then
            echo "No version metadata changes to commit."
          else
            git commit -m "chore: release ${{ inputs.version }}"
          fi

      - name: Capture release commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and verify tag
        run: |
          VERSION="${{ inputs.version }}"
          RELEASE_SHA="${{ steps.release_commit.outputs.sha }}"
          git tag "$VERSION" "$RELEASE_SHA"

          TAG_SHA=$(git rev-list -n 1 "$VERSION")
          if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "Tag $VERSION points to $TAG_SHA, expected $RELEASE_SHA"
            exit 1
          fi

          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$VERSION" npm run verify-release -- --expected-version="$VERSION"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin "${{ inputs.version }}"

      - name: Verify remote tag commit
        run: |
          VERSION="${{ inputs.version }}"
          RELEASE_SHA="${{ steps.release_commit.outputs.sha }}"
          REMOTE_SHA=$(git ls-remote origin "refs/tags/$VERSION^{}" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA=$(git ls-remote origin "refs/tags/$VERSION" | awk '{print $1}')
          fi
          if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "Remote tag $VERSION points to $REMOTE_SHA, expected $RELEASE_SHA"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: ./release-notes-${{ inputs.version }}.md
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
